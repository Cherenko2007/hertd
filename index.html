<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Винное сердце</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;

// ================= ПАЛИТРА (вино) =================
function makeGlow(r, g, b) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const grad = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0.0, `rgba(${r},${g},${b},1)`);
  grad.addColorStop(0.3, `rgba(${r},${g},${b},0.55)`);
  grad.addColorStop(1.0, `rgba(${r},${g},${b},0)`);
  x.fillStyle = grad;
  x.fillRect(0, 0, 64, 64);
  return c;
}
const spDim    = makeGlow(107, 15, 26);   // тусклое вино
const spMid    = makeGlow(190, 30, 60);   // вино
const spBright = makeGlow(255, 90, 130);  // яркое ядро

// ================= ГЕОМЕТРИЯ =================
function heartPoint(t) { // классическая кривая сердца
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return { x, y };
}

let heartParticles = [], poolParticles = [], plasmaParticles = [];
let CX, CY, S, POOL_X, POOL_Y;

function buildScene() {
  CX = W / 2;
  CY = H * 0.42;
  S = Math.min(W, H) / 38;
  POOL_X = CX;
  POOL_Y = CY + 18.5 * S; // котёл чуть ниже нижней точки сердца

  // --- частицы сердца (контур + наполнение) ---
  heartParticles = [];
  for (let i = 0; i < 550; i++) {
    const t = Math.random() * Math.PI * 2;
    const p = heartPoint(t);
    const r = Math.random();
    let k = 1;
    if (r < 0.45)      k = 0.25 + 0.75 * Math.sqrt(Math.random()); // внутри
    else if (r < 0.6)  k = 0.95 + Math.random() * 0.08;            // контур
    heartParticles.push({
      tx: CX + p.x * S * k,
      ty: CY - p.y * S * k,
      x: CX + (Math.random()-0.5) * W,   // старт — хаос (как в начале видео)
      y: CY + (Math.random()-0.5) * H,
      size: 1.2 + Math.random() * 2.2,
      tw: Math.random() * Math.PI * 2,
      tws: 0.6 + Math.random() * 2
    });
  }

  // --- частицы котла (крутятся внизу) ---
  poolParticles = [];
  for (let i = 0; i < 160; i++) {
    poolParticles.push({
      a: Math.random() * Math.PI * 2,
      r: 0.35 + Math.random() * 0.65,
      s: 0.7 + Math.random() * 1.2,
      sz: 1.4 + Math.random() * 2.4,
      tw: Math.random() * Math.PI * 2
    });
  }

  // --- плазма: летает между котлом и сердцем ---
  plasmaParticles = [];
  for (let i = 0; i < 220; i++) {
    plasmaParticles.push({
      u: Math.random(),          // 0 = котёл, 1 = сердце
      ht: Math.random() * Math.PI * 2,
      hk: 0.2 + 0.75 * Math.sqrt(Math.random()),
      pa: Math.random() * Math.PI * 2,
      pr: 0.3 + Math.random() * 0.7,
      seed: Math.random() * 1000,
      sz: 1.2 + Math.random() * 2.4
    });
  }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  buildScene();
}
window.addEventListener('resize', resize);

// ================= УТИЛИТЫ =================
function ss(a, b, x) { // плавный шаг 0..1
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
function drawSprite(img, x, y, size, alpha) {
  if (alpha <= 0.01) return;
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.drawImage(img, x - size, y - size, size * 2, size * 2);
}

// ================= МОЛНИИ (внутри сердца при вспышке) =================
function drawBolt(alpha) {
  let x = CX + (Math.random()-0.5) * 11 * S;
  let y = CY + (Math.random()-0.5) * 8 * S;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 0; i < 6; i++) {
    x += (Math.random()-0.5) * 3.5 * S;
    y += (Math.random()-0.5) * 2.5 * S;
    ctx.lineTo(x, y);
  }
  ctx.strokeStyle = `rgba(255,150,180,${alpha})`;
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

// ================= ГЛАВНЫЙ ЦИКЛ =================
const CYCLE = 13; // секунд на полный цикл

function frame() {
  const time = performance.now() / 1000;
  const t = (time % CYCLE) / CYCLE; // фаза цикла 0..1

  // --- фазы ---
  const charge  = ss(0.20, 0.48, t) * (1 - ss(0.80, 0.97, t)); // разгон
  const burst   = ss(0.50, 0.58, t) * (1 - ss(0.70, 0.84, t)); // вспышка
  const release = ss(0.70, 0.78, t) * (1 - ss(0.92, 1.0, t));  // остывание
  const spin    = 0.35 + charge * 2.6 + burst * 1.5;         // скорость вихря

  // затухание кадра (шлейфы)
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // --- свечение котла ---
  const poolGlow = 0.08 + 0.30 * charge + 0.45 * burst;
  ctx.globalAlpha = Math.min(1, poolGlow);
  ctx.drawImage(spMid, POOL_X - 11 * S, POOL_Y - 3.5 * S, 22 * S, 7 * S);
  ctx.drawImage(spBright, POOL_X - 6 * S * (0.5 + burst), POOL_Y - 2 * S, 12 * S * (0.5 + burst), 4 * S);

  // --- частицы котла (вращаются) ---
  for (const p of poolParticles) {
    p.a += 0.028 * spin * p.s;
    const rx = S * 9 * p.r, ry = S * 2.6 * p.r;
    const x = POOL_X + Math.cos(p.a) * rx;
    const y = POOL_Y + Math.sin(p.a) * ry * 0.45 + Math.sin(time * 3 + p.tw) * 1.5;
    const tw = 0.6 + 0.4 * Math.sin(time * 4 * p.s + p.tw);
    const a = (0.28 + 0.45 * charge + 0.35 * burst) * tw;
    drawSprite(burst > 0.5 ? spBright : spMid, x, y, p.sz * 1.6, a);
  }

  // --- плазма между котлом и сердцем ---
  for (const p of plasmaParticles) {
    if (burst > 0.4) p.u = Math.min(1, p.u + 0.06);
    else p.u += 0.004 * charge - 0.010 * release;
    p.u = Math.max(0, Math.min(1, p.u));
    const uu = p.u * p.u * (3 - 2 * p.u); // сглаживание пути

    const hp = heartPoint(p.ht);
    const hx = CX + hp.x * S * p.hk;
    const hy = CY - hp.y * S * p.hk;
    const ox = POOL_X + Math.cos(p.pa) * S * 7 * p.pr;
    const oy = POOL_Y + Math.sin(p.pa) * S * 1.6 * p.pr;

    const chaos = (0.4 + burst * 4.5) * uu;
    const x = ox + (hx - ox) * uu + Math.sin(time * 7 + p.seed) * 3 * chaos;
    const y = oy + (hy - oy) * uu + Math.cos(time * 6.3 + p.seed * 1.7) * 3 * chaos;

    const a = (0.08 + 0.45 * charge + 0.85 * burst) * (0.3 + 0.7 * uu);
    drawSprite(spBright, x, y, p.sz * 1.5, a);
  }

  // --- частицы сердца ---
  const hb = 0.26 + 0.35 * charge + 0.60 * burst; // яркость сердца
  const k = 1 - 0.5 * burst;                       // стягивание к центру при вспышке
  const j = 0.5 + burst * 6;                       // дрожь
  for (const p of heartParticles) {
    const hx = CX + (p.tx - CX) * k;
    const hy = CY + (p.ty - CY) * k;
    p.x += (hx - p.x) * 0.09 + (Math.random()-0.5) * j;
    p.y += (hy - p.y) * 0.09 + (Math.random()-0.5) * j;
    const tw = 0.55 + 0.45 * Math.sin(time * p.tws * 3 + p.tw);
    const a = Math.max(0.05, hb * tw);
    const img = burst > 0.45 ? spBright : (charge > 0.4 ? spMid : spDim);
    drawSprite(img, p.x, p.y, p.size * (1 + burst), a);
  }

  // --- молнии внутри сердца ---
  if (burst > 0.3) {
    for (let i = 0; i < 6; i++) {
      if (Math.random() < burst) drawBolt(0.35 * burst);
    }
    // общая вспышка сердца
    ctx.globalAlpha = 0.18 * burst;
    ctx.drawImage(spBright, CX - 12 * S, CY - 11 * S, 24 * S, 22 * S);
  }

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
