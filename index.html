<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Bordeaux Heart — 4 phases</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
  }
  body {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
  }
  canvas#scene {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<script>
(function () {
  'use strict';

  /* ============================================================
     0. ХЕЛПЕРЫ
     ============================================================ */
  const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
  const lerp  = (a, b, t) => a + (b - a) * t;

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  /* ============================================================
     1. CANVAS + АДАПТАЦИЯ
     ============================================================ */
  const canvas = document.getElementById('scene');
  const ctx    = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0, DPR = 1;
  let cx = 0, cy = 0;         // центр экрана (CSS-пиксели)
  let S  = 1;                 // «радиус» сердца в пикселях
  let puddleX = 0, puddleY = 0, puddleRx = 0, puddleRy = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);

    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    cx = W / 2;
    cy = H / 2;
    S  = Math.min(W, H) * 0.62;

    // Геометрия «котла» — лужи под сердцем
    const heartBottom = cy + nMaxY * S;
    puddleX  = cx;
    puddleY  = heartBottom + S * 0.06;
    puddleRx = S * 0.32;
    puddleRy = S * 0.09;

    // Полная очистка — чтобы на ресайзе не осталось артефактов
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  /* ============================================================
     2. МАТЕМАТИЧЕСКАЯ КРИВАЯ СЕРДЦА
        x = 16·sin³t
        y = 13·cos t − 5·cos 2t − 2·cos 3t − cos 4t
     Нормализуем так, чтобы сердце умещалось в [-0.5 … +0.5],
     и инвертируем Y (в canvas +Y идёт вниз).
     ============================================================ */
  function heartRaw(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x, y };
  }

  const OUTLINE_N = 420;
  const rawPts = [];
  let rMinX =  Infinity, rMaxX = -Infinity;
  let rMinY =  Infinity, rMaxY = -Infinity;

  for (let i = 0; i < OUTLINE_N; i++) {
    const t = (i / OUTLINE_N) * Math.PI * 2;
    const p = heartRaw(t);
    rawPts.push(p);
    if (p.x < rMinX) rMinX = p.x;
    if (p.x > rMaxX) rMaxX = p.x;
    if (p.y < rMinY) rMinY = p.y;
    if (p.y > rMaxY) rMaxY = p.y;
  }

  const rawSpan = Math.max(rMaxX - rMinX, rMaxY - rMinY);
  const rawCx   = (rMinX + rMaxX) / 2;
  const rawCy   = (rMinY + rMaxY) / 2;

  const outline = rawPts.map(p => ({
    x:  (p.x - rawCx) / rawSpan,
    y: -(p.y - rawCy) / rawSpan
  }));

  let nMinX =  Infinity, nMaxX = -Infinity;
  let nMinY =  Infinity, nMaxY = -Infinity;
  for (let i = 0; i < outline.length; i++) {
    const p = outline[i];
    if (p.x < nMinX) nMinX = p.x;
    if (p.x > nMaxX) nMaxX = p.x;
    if (p.y < nMinY) nMinY = p.y;
    if (p.y > nMaxY) nMaxY = p.y;
  }

  // Тест «точка внутри полигона» — ray casting
  function pointInPoly(px, py, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].x, yi = poly[i].y;
      const xj = poly[j].x, yj = poly[j].y;
      const hit = ((yi > py) !== (yj > py)) &&
                  (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
      if (hit) inside = !inside;
    }
    return inside;
  }

  // Случайная точка строго внутри сердца (в нормализованных координатах)
  function randomInteriorPoint() {
    for (let i = 0; i < 80; i++) {
      const x = nMinX + Math.random() * (nMaxX - nMinX);
      const y = nMinY + Math.random() * (nMaxY - nMinY);
      if (pointInPoly(x, y, outline)) return { x, y };
    }
    return { x: 0, y: 0 };
  }

  /* ============================================================
     3. ПРЕДРЕНДЕР СПРАЙТОВ СВЕЧЕНИЯ
        Рисовать radial-gradient для каждой из ~1000 частиц каждый кадр
        слишком дорого. Поэтому заранее делаем «огоньки» и растягиваем.
     ============================================================ */
  const SPR_SIZE = 128;

  function makeSprite(hex, hot) {
    const c = document.createElement('canvas');
    c.width = c.height = SPR_SIZE;
    const g = c.getContext('2d');
    const rgb = hexToRgb(hex);
    const R = SPR_SIZE / 2;

    const grd = g.createRadialGradient(R, R, 0, R, R, R);

    if (hot) {
      grd.addColorStop(0.00, 'rgba(255, 240, 230, 0.95)');
      grd.addColorStop(0.15, 'rgba(255, 170, 140, 0.70)');
      grd.addColorStop(0.35, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ', 0.45)');
      grd.addColorStop(0.70, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ', 0.10)');
      grd.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    } else {
      const cr = Math.min(255, rgb.r + 90);
      const cg = Math.min(255, rgb.g + 40);
      const cb = Math.min(255, rgb.b + 45);
      grd.addColorStop(0.00, 'rgba(' + cr + ',' + cg + ',' + cb + ', 0.85)');
      grd.addColorStop(0.25, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ', 0.55)');
      grd.addColorStop(0.60, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ', 0.12)');
      grd.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    }

    g.fillStyle = grd;
    g.fillRect(0, 0, SPR_SIZE, SPR_SIZE);
    return c;
  }

  // Винные / бордовые оттенки
  const COLORS       = ['#6b0f1a', '#8b1a2b', '#a61c3a', '#4a0a12'];
  const SPRITES      = COLORS.map(c => makeSprite(c, false));
  const HOT_SPRITES  = COLORS.map(c => makeSprite(c, true));

  /* ============================================================
     4. ЧАСТИЦЫ
        • heartParts   — держат форму сердца (контур + внутренность)
        • vortexParts  — крутятся вокруг лужи-котла, при вспышке
                         выстреливают вверх внутрь сердца.
     ============================================================ */

  const heartParts  = [];
  const vortexParts = [];

  function makeHeartParticle() {
    let tx, ty;

    if (Math.random() < 0.5) {
      // --- на контуре (с крошечным разбросом, чтобы линия была «живой») ---
      const f  = Math.random() * outline.length;
      const i0 = Math.floor(f) % outline.length;
      const i1 = (i0 + 1) % outline.length;
      const k  = f - Math.floor(f);
      tx = lerp(outline[i0].x, outline[i1].x, k);
      ty = lerp(outline[i0].y, outline[i1].y, k);
    } else {
      // --- равномерно внутри сердца ---
      const p = randomInteriorPoint();
      tx = p.x; ty = p.y;
    }

    return {
      tx, ty,                          // цель в нормализованном пространстве
      x: 0, y: 0,                      // текущая позиция (CSS-пиксели)
      vx: 0, vy: 0,                    // скорость (для фазы вспышки/остывания)

      r: 2.5 + Math.random() * 3.0,    // размер
      colorIdx: (Math.random() * COLORS.length) | 0,
      hot: Math.random() < 0.30,       // «раскалённая» частица

      flickPhase: Math.random() * Math.PI * 2,
      flickSpeed: 2 + Math.random() * 8,

      driftPhase: Math.random() * Math.PI * 2,
      driftSpeed: 0.4 + Math.random() * 1.4,

      seed: Math.random() * 1000
    };
  }

  function makeVortexParticle() {
    // радиус в [0.15 … 1.0], распределение с уплотнением к центру
    const rad = 0.15 + Math.pow(Math.random(), 0.7) * 0.85;
    return {
      angle: Math.random() * Math.PI * 2,
      radius: rad,
      angularSpeedBase: 0.6 + Math.random() * 1.0,

      // Смещение от орбитальной позиции — используется при запуске
      offX: 0, offY: 0,
      ovx: 0, ovy: 0,

      x: 0, y: 0,
      r: 2 + Math.random() * 3,
      colorIdx: (Math.random() * COLORS.length) | 0,
      hot: Math.random() < 0.5,

      flickPhase: Math.random() * Math.PI * 2,
      flickSpeed: 5 + Math.random() * 10,

      seed: Math.random() * 1000
    };
  }

  function buildParticles() {
    const minDim = Math.min(W, H);
    const heartCount  = Math.round(clamp(minDim * 1.40, 550, 1100));
    const vortexCount = Math.round(clamp(minDim * 0.40, 150, 300));

    heartParts.length = 0;
    for (let i = 0; i < heartCount; i++) {
      const p = makeHeartParticle();
      p.x = cx + p.tx * S;
      p.y = cy + p.ty * S;
      p.vx = 0; p.vy = 0;
      heartParts.push(p);
    }

    vortexParts.length = 0;
    for (let i = 0; i < vortexCount; i++) {
      vortexParts.push(makeVortexParticle());
    }
  }

  /* ============================================================
     5. МОЛНИИ (внутренние разряды)
     ============================================================ */
  const arcs = [];

  function makeArc(power) {
    // Оба конца — случайные точки внутри сердца
    const a = randomInteriorPoint();
    const b = randomInteriorPoint();

    const steps = 6 + ((Math.random() * 6) | 0);
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const f = i / steps;
      let x = lerp(a.x, b.x, f);
      let y = lerp(a.y, b.y, f);
      const jit = Math.sin(f * Math.PI) * 0.06 * (0.5 + power);
      x += (Math.random() - 0.5) * jit;
      y += (Math.random() - 0.5) * jit;
      pts.push({ x, y });
    }

    const life = 0.12 + Math.random() * 0.22;
    return { pts, life, lifeMax: life };
  }

  /* ============================================================
     6. ФАЗЫ
        Покой → Разгон → Вспышка → Остывание → …
     ============================================================ */
  const PHASES = [
    { name: 'rest',       dur: 4.0 },
    { name: 'accelerate', dur: 3.5 },
    { name: 'flash',      dur: 1.8 },
    { name: 'cool',       dur: 3.7 }
  ];

  let phaseIdx  = 0;
  let phaseT    = 0;
  let phaseName = PHASES[0].name;

  // Сглаженные глобальные величины
  let energy     = 0.15;   // 0..1 — общая «раскалённость» сцены
  let vortexMult = 1.0;    // множитель скорости вихря
  let chaos      = 0.0;    // 0..1 — насколько сердце «кипит»

  let arcTimer = 0;        // таймер спавна молний
  let time     = 0;        // глобальное время анимации

  function onEnterPhase(name) {
    if (name === 'flash') {
      // -------- ВЗРЫВ --------
      // Лёгкий импульс частицам сердца наружу (ради «толчка»)
      for (let i = 0; i < heartParts.length; i++) {
        const p = heartParts[i];
        const dx = p.x - cx;
        const dy = p.y - cy;
        const len = Math.hypot(dx, dy) || 1;
        const imp = 60 + Math.random() * 120;
        p.vx += (dx / len) * imp;
        p.vy += (dy / len) * imp;
      }
      // Вихрь выстреливает вверх — задаём скорость запуска
      for (let i = 0; i < vortexParts.length; i++) {
        const p = vortexParts[i];
        p.ovx = (Math.random() - 0.5) * 260;
        p.ovy = -(1200 + Math.random() * 600); // вверх
      }
      arcTimer = 0;
    }
  }

  /* ============================================================
     7. ОБНОВЛЕНИЕ
     ============================================================ */
  function update(dt) {
    time += dt;
    phaseT += dt;

    // ---- Переключение фаз ----
    let guard = 0;
    while (phaseT >= PHASES[phaseIdx].dur && guard++ < 8) {
      phaseT -= PHASES[phaseIdx].dur;
      phaseIdx = (phaseIdx + 1) % PHASES.length;
      phaseName = PHASES[phaseIdx].name;
      onEnterPhase(phaseName);
    }

    const pProg = phaseT / PHASES[phaseIdx].dur; // 0..1 внутри фазы

    // ---- Целевые значения для сглаженных величин ----
    let energyT, vortexMultT, chaosT, smoothRate;

    if (phaseName === 'rest') {
      energyT     = 0.15;
      vortexMultT = 1.0;
      chaosT      = 0.0;
      smoothRate  = 2.5;

    } else if (phaseName === 'accelerate') {
      // Плавное ускорение: ease-in — медленный старт, быстрый конец
      const e = pProg * pProg;
      energyT     = 0.15 + 0.85 * e;
      vortexMultT = 1.0 + 11.0 * e;
      chaosT      = 0.0;
      smoothRate  = 3.5;

    } else if (phaseName === 'flash') {
      energyT     = 1.0;
      vortexMultT = 14.0;
      chaosT      = 1.0;
      smoothRate  = 6.0;   // быстрее откликается

    } else { // cool
      const e = 1 - Math.pow(1 - pProg, 2); // ease-out
      energyT     = 1.0 - 0.85 * e;
      vortexMultT = 14.0 - 13.0 * e;
      chaosT      = 1.0 - e;
      smoothRate  = 2.5;
    }

    // ---- Экспоненциальное сглаживание — фазы без рывков ----
    const aRate = Math.min(1, dt * smoothRate);
    energy     += (energyT     - energy)     * aRate;
    vortexMult += (vortexMultT - vortexMult) * aRate;
    chaos      += (chaosT      - chaos)      * aRate;

    /* ------------------------------------------------------------
       Частицы СЕРДЦА
       Пружина к своей цели + шум. При chaos→0 — дрожат на месте,
       при chaos→1 — кипят и мечутся.
       ------------------------------------------------------------ */
    const kSpring  = lerp(90, 1.0, chaos);   // жёсткость пружины
    const kDamp    = lerp(11, 0.8, chaos);   // демпфирование
    const noiseAmp = lerp(6, 700, chaos);    // амплитуда шума (px/s²)

    // Лёгкая пульсация формы
    const pulse = 1 + 0.012 * Math.sin(time * 2.1);

    for (let i = 0; i < heartParts.length; i++) {
      const p = heartParts[i];

      const TX = cx + p.tx * S * pulse;
      const TY = cy + p.ty * S * pulse;

      // Пружина
      const ax = -kSpring * (p.x - TX) - kDamp * p.vx;
      const ay = -kSpring * (p.y - TY) - kDamp * p.vy;

      p.vx += ax * dt;
      p.vy += ay * dt;

      // Шум
      p.vx += (Math.random() - 0.5) * noiseAmp * dt;
      p.vy += (Math.random() - 0.5) * noiseAmp * dt;

      // Интеграция
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    /* ------------------------------------------------------------
       Частицы КОТЛА (вихрь)
       1) угол всегда движется со скоростью ~ vortexMult
       2) у каждой частицы есть смещение offX/offY от орбитальной
          позиции — оно «0» в покое и растёт при запуске вверх
       ------------------------------------------------------------ */
    for (let i = 0; i < vortexParts.length; i++) {
      const p = vortexParts[i];

      // Орбитальный угол
      p.angle += p.angularSpeedBase * vortexMult * dt;

      // Орбитальная позиция (эллипс — вид на «лужу» сверху-сбоку)
      const orbitX = puddleX + Math.cos(p.angle) * p.radius * puddleRx;
      const orbitY = puddleY + Math.sin(p.angle) * p.radius * puddleRy;

      // Физика смещения от орбитальной позиции
      let kOff, dOff;
      if (phaseName === 'flash') {
        kOff = 0.0;   // пружины нет — частица свободно летит
        dOff = 3.0;   // лёгкое сопротивление воздуха
      } else if (phaseName === 'cool') {
        kOff = 6.0;   // пружина возвращает обратно
        dOff = 5.0;
      } else {
        kOff = 100;   // очень жёсткая — смещение ~0
        dOff = 20;
      }

      const oax = -kOff * p.offX - dOff * p.ovx;
      const oay = -kOff * p.offY - dOff * p.ovy;

      p.ovx += oax * dt;
      p.ovy += oay * dt;

      // Гравитация тянет вниз только в фазе вспышки
      if (phaseName === 'flash') {
        p.ovy += 700 * dt;
        // Немного шума — плазма «кипит» в полёте
        p.ovx += (Math.random() - 0.5) * 400 * dt;
        p.ovy += (Math.random() - 0.5) * 400 * dt;
      }

      p.offX += p.ovx * dt;
      p.offY += p.ovy * dt;

      // Итоговая позиция
      p.x = orbitX + p.offX;
      p.y = orbitY + p.offY;
    }

    /* ------------------------------------------------------------
       Молнии
       ------------------------------------------------------------ */
    if (phaseName === 'flash') {
      arcTimer -= dt;
      if (arcTimer <= 0) {
        arcs.push(makeArc(1.0));
        arcTimer = 0.015 + Math.random() * 0.06;
      }
    } else if (phaseName === 'accelerate' && pProg > 0.7) {
      // редкие предвестники перед вспышкой
      arcTimer -= dt;
      if (arcTimer <= 0) {
        arcs.push(makeArc(0.4));
        arcTimer = 0.15 + Math.random() * 0.20;
      }
    }

    for (let i = arcs.length - 1; i >= 0; i--) {
      arcs[i].life -= dt;
      if (arcs[i].life <= 0) arcs.splice(i, 1);
    }
  }

  /* ============================================================
     8. РЕНДЕР
     ============================================================ */

  // Лужа-«котёл» — сияющая винная плазма
  function drawPuddle() {
    const flick    = 0.85 + 0.15 * Math.sin(time * 9.3);
    const strength = (0.40 + 0.60 * energy) * flick;

    const rx = puddleRx * (1 + 0.05 * Math.sin(time * 1.7));
    const ry = puddleRy;

    ctx.save();
    ctx.translate(puddleX, puddleY);
    ctx.scale(1, ry / rx);

    // Широкое внешнее свечение
    const g1 = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 1.7);
    g1.addColorStop(0.00, 'rgba(255, 120, 100, ' + (0.14 * strength) + ')');
    g1.addColorStop(0.30, 'rgba(170,  25,  50, ' + (0.16 * strength) + ')');
    g1.addColorStop(0.65, 'rgba( 90,  10,  25, ' + (0.10 * strength) + ')');
    g1.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.arc(0, 0, rx * 1.7, 0, Math.PI * 2);
    ctx.fill();

    // Яркое ядро
    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 0.7);
    g2.addColorStop(0.00, 'rgba(255, 170, 140, ' + (0.40 * strength) + ')');
    g2.addColorStop(0.50, 'rgba(200,  55,  65, ' + (0.18 * strength) + ')');
    g2.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(0, 0, rx * 0.7, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Внутреннее свечение самого сердца (усиливается вместе с energy)
  function drawHeartCore() {
    if (energy < 0.05) return;
    const flick = 0.85 + 0.15 * Math.sin(time * 8.7);
    const R  = S * 0.42;
    const ox = cx;
    const oy = cy + S * 0.02;

    const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, R);
    g.addColorStop(0.00, 'rgba(210, 45, 65, ' + (0.10 * energy * flick) + ')');
    g.addColorStop(0.50, 'rgba(120, 15, 35, ' + (0.07 * energy * flick) + ')');
    g.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ox, oy, R, 0, Math.PI * 2);
    ctx.fill();
  }

  // Все частицы сердца
  function drawHeartParticles() {
    for (let i = 0; i < heartParts.length; i++) {
      const p = heartParts[i];

      // Яркость растёт вместе с energy
      const base     = 0.70 + 0.30 * energy;
      const flickAmp = 0.10 + 0.45 * energy;
      const flick    = base + flickAmp * Math.sin(time * p.flickSpeed + p.flickPhase);
      const alpha    = clamp(flick, 0, 1);
      if (alpha <= 0.01) continue;

      // Лёгкий дрейф, заметный в покое и исчезающий в хаосе
      const driftAmp = (1 - chaos) * 1.5;
      const drawX = p.x + Math.sin(time * p.driftSpeed + p.driftPhase) * driftAmp;
      const drawY = p.y + Math.cos(time * p.driftSpeed * 1.1 + p.driftPhase * 1.3) * driftAmp;

      // «Раскалённый» вид при высокой энергии
      const useHot = (p.hot || energy > 0.9);
      const spr = useHot ? HOT_SPRITES[p.colorIdx] : SPRITES[p.colorIdx];

      const r = p.r * (1 + 0.4 * energy + 0.5 * chaos);

      ctx.globalAlpha = alpha;
      ctx.drawImage(spr, drawX - r * 2, drawY - r * 2, r * 4, r * 4);
    }
    ctx.globalAlpha = 1;
  }

  // Частицы вихря
  function drawVortexParticles() {
    for (let i = 0; i < vortexParts.length; i++) {
      const p = vortexParts[i];

      const flick = 0.65 + 0.35 * Math.sin(time * p.flickSpeed + p.flickPhase);
      const alpha = (0.35 + 0.65 * energy) * flick;
      if (alpha <= 0.01) continue;

      const useHot = (p.hot && energy > 0.5);
      const spr = useHot ? HOT_SPRITES[p.colorIdx] : SPRITES[p.colorIdx];

      const r = p.r * (1 + 0.5 * energy);

      ctx.globalAlpha = alpha;
      ctx.drawImage(spr, p.x - r * 2, p.y - r * 2, r * 4, r * 4);
    }
    ctx.globalAlpha = 1;
  }

  // Молнии
  function drawArcs() {
    ctx.lineJoin = 'round';
    ctx.lineCap  = 'round';

    for (let i = 0; i < arcs.length; i++) {
      const a = arcs[i];
      const k = a.life / a.lifeMax;
      if (k <= 0) continue;

      ctx.beginPath();
      ctx.moveTo(cx + a.pts[0].x * S, cy + a.pts[0].y * S);
      for (let j = 1; j < a.pts.length; j++) {
        ctx.lineTo(cx + a.pts[j].x * S, cy + a.pts[j].y * S);
      }

      // Внешнее свечение
      ctx.strokeStyle = 'rgba(160, 25, 50, ' + (0.35 * k) + ')';
      ctx.lineWidth = 4.5;
      ctx.stroke();

      // Средний слой
      ctx.strokeStyle = 'rgba(225, 70, 90, ' + (0.60 * k) + ')';
      ctx.lineWidth = 2.0;
      ctx.stroke();

      // Яркое ядро
      ctx.strokeStyle = 'rgba(255, 220, 215, ' + (0.90 * k) + ')';
      ctx.lineWidth = 0.9;
      ctx.stroke();
    }
  }

  // Полный кадр
  function render() {
    // 1) Затемняем предыдущий кадр — остаются «шлейфы» искр
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.fillRect(0, 0, W, H);

    // 2) Всё свечение — аддитивно
    ctx.globalCompositeOperation = 'lighter';

    drawHeartCore();
    drawPuddle();
    drawVortexParticles();
    drawHeartParticles();
    drawArcs();

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     9. ГЛАВНЫЙ ЦИКЛ
     ============================================================ */
  let lastT = 0;

  function frame(now) {
    if (!lastT) lastT = now;
    let dt = (now - lastT) / 1000;
    lastT = now;

    // Защита от больших скачков (свёрнутая вкладка, лаги)
    if (dt > 0.05) dt = 0.05;
    if (dt < 0)    dt = 0;

    update(dt);
    render();

    requestAnimationFrame(frame);
  }

  /* ============================================================
     10. ИНИЦИАЛИЗАЦИЯ
     ============================================================ */
  resize();
  buildParticles();
  onEnterPhase('rest');
  requestAnimationFrame(frame);

  // Реакция на изменение размеров
  window.addEventListener('resize', function () {
    resize();
    // Возвращаем частицы сердца к их целям в новых координатах
    for (let i = 0; i < heartParts.length; i++) {
      const p = heartParts[i];
      p.x = cx + p.tx * S;
      p.y = cy + p.ty * S;
      p.vx = 0; p.vy = 0;
    }
  }, { passive: true });

  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      resize();
      for (let i = 0; i < heartParts.length; i++) {
        const p = heartParts[i];
        p.x = cx + p.tx * S;
        p.y = cy + p.ty * S;
        p.vx = 0; p.vy = 0;
      }
    }, 150);
  }, { passive: true });

})();
</script>
</body>
</html>
