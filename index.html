<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Bordeaux Heart</title>
<style>
  /* ---------- Чёрный фон на всю страницу, ничего кроме анимации ---------- */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  body {
    /* убираем подсветку тапов и выделение на мобильных */
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  canvas#scene {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<script>
(function () {
  'use strict';

  /* ============================================================
     0. МЕЛКИЕ ХЕЛПЕРЫ
     ============================================================ */

  const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
  const lerp  = (a, b, t) => a + (b - a) * t;

  /** Плавная S-образная интерполяция */
  function smoothstep(edge0, edge1, x) {
    const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  /** "#rrggbb" -> {r,g,b} */
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  /* ============================================================
     1. НАСТРОЙКИ И ПАЛИТРА
     ============================================================ */

  // Винные / бордовые оттенки — от почти чёрного до яркого вина
  const WINE_PALETTE = [
    '#4a0a12',
    '#6b0f1a',
    '#7a0e1e',
    '#8b1a2b',
    '#a5172c'
  ];

  const CONTOUR_RATIO = 0.50;   // доля частиц, сидящих точно на контуре сердца
  const HEART_SIZE_K  = 0.70;   // размер сердца = 70% от min(ширина, высота)

  // Фазы анимации (секунды). Полный цикл = сумма всех dur.
  const PHASES = [
    { name: 'gather',   dur: 3.6 },  // 1. сборка из хаотичного облака
    { name: 'ignite',   dur: 2.2 },  // 2. розжиг: плазма поднимается снизу вверх
    { name: 'burn',     dur: 3.0 },  // 3. пульс, тлеющее горение, разряды
    { name: 'disperse', dur: 2.4 }   // 4. распад на летящие искры
  ];

  /* ============================================================
     2. CANVAS, РАЗМЕРЫ, АДАПТАЦИЯ
     ============================================================ */

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0;        // размеры в CSS-пикселях
  let cx = 0, cy = 0;      // центр экрана
  let S  = 1;              // масштаб сердца (1.0 нормализованного сердца = S пикселей)
  let DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2); // ограничиваем 2x ради производительности
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);

    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    // Рисуем в координатах CSS-пикселей
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    cx = W / 2;
    cy = H / 2;
    S  = Math.min(W, H) * HEART_SIZE_K;

    // После изменения размера полностью заливаем чёрным (сбрасываем «шлейфы»)
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  /* ============================================================
     3. МАТЕМАТИКА СЕРДЦА
     ============================================================ */

  /**
   * Классическая параметрическая кривая сердца.
   * x = 16 sin^3(t)
   * y = 13 cos(t) - 5 cos(2t) - 2 cos(3t) - cos(4t)
   * Здесь y направлен ВВЕРХ (математические координаты).
   */
  function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: x, y: y };
  }

  const OUTLINE_N = 360;              // количество точек контура
  const rawOutline = [];              // сырые точки кривой

  let rMinX =  Infinity, rMaxX = -Infinity;
  let rMinY =  Infinity, rMaxY = -Infinity;

  for (let i = 0; i < OUTLINE_N; i++) {
    const t = (i / OUTLINE_N) * Math.PI * 2;
    const p = heartPoint(t);
    rawOutline.push(p);
    if (p.x < rMinX) rMinX = p.x;
    if (p.x > rMaxX) rMaxX = p.x;
    if (p.y < rMinY) rMinY = p.y;
    if (p.y > rMaxY) rMaxY = p.y;
  }

  const rawSpan = Math.max(rMaxX - rMinX, rMaxY - rMinY);
  const rawCx   = (rMinX + rMaxX) / 2;
  const rawCy   = (rMinY + rMaxY) / 2;

  /**
   * Нормализованный контур:
   *  - центр в (0, 0)
   *  - размер примерно от -0.5 до +0.5 по большей оси
   *  - ось Y перевёрнута (в canvas Y растёт вниз)
   */
  const outline = rawOutline.map(function (p) {
    return {
      x:  (p.x - rawCx) / rawSpan,
      y: -(p.y - rawCy) / rawSpan
    };
  });

  // Границы нормализованного сердца (нужны для заливки «снизу вверх»)
  let nMinX =  Infinity, nMaxX = -Infinity;
  let nMinY =  Infinity, nMaxY = -Infinity;
  for (let i = 0; i < outline.length; i++) {
    const p = outline[i];
    if (p.x < nMinX) nMinX = p.x;
    if (p.x > nMaxX) nMaxX = p.x;
    if (p.y < nMinY) nMinY = p.y;
    if (p.y > nMaxY) nMaxY = p.y;
  }

  /**
   * Тест «точка внутри полигона» (ray casting).
   * Используется для равномерного заполнения внутренности сердца.
   */
  function pointInPoly(px, py, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].x, yi = poly[i].y;
      const xj = poly[j].x, yj = poly[j].y;
      const intersect = ((yi > py) !== (yj > py)) &&
                        (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  /* ============================================================
     4. СПРАЙТЫ ЧАСТИЦ (предрендер свечения)
     ============================================================
     Рисовать radial-gradient для каждой из ~1000 частиц каждый кадр —
     дорого. Поэтому заранее готовим спрайты-«огоньки» и потом просто
     растягиваем их через drawImage.
  */

  const SPRITE_SIZE = 128;

  function makeSprite(hex, hot) {
    const c = document.createElement('canvas');
    c.width = c.height = SPRITE_SIZE;
    const g = c.getContext('2d');

    const rgb = hexToRgb(hex);
    const r = rgb.r, gg = rgb.g, b = rgb.b;
    const R = SPRITE_SIZE / 2;

    const grd = g.createRadialGradient(R, R, 0, R, R, R);

    if (hot) {
      // «Раскалённая» искра: бело-тёплое ядро, переходящее в вино
      grd.addColorStop(0.00, 'rgba(255, 240, 225, 0.95)');
      grd.addColorStop(0.10, 'rgba(255, 160, 120, 0.80)');
      grd.addColorStop(0.28, 'rgba(' + r + ',' + gg + ',' + b + ', 0.55)');
      grd.addColorStop(0.60, 'rgba(' + r + ',' + gg + ',' + b + ', 0.15)');
      grd.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    } else {
      // Обычная «тлеющая» частица
      const cr = Math.min(255, r + 110);
      const cg = Math.min(255, gg + 45);
      const cb = Math.min(255, b + 55);
      grd.addColorStop(0.00, 'rgba(' + cr + ',' + cg + ',' + cb + ', 0.90)');
      grd.addColorStop(0.22, 'rgba(' + r + ',' + gg + ',' + b + ', 0.70)');
      grd.addColorStop(0.55, 'rgba(' + r + ',' + gg + ',' + b + ', 0.16)');
      grd.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    }

    g.fillStyle = grd;
    g.fillRect(0, 0, SPRITE_SIZE, SPRITE_SIZE);
    return c;
  }

  const sprites    = WINE_PALETTE.map(function (hex) { return makeSprite(hex, false); });
  const hotSprites = WINE_PALETTE.map(function (hex) { return makeSprite(hex, true);  });

  /* ============================================================
     5. ЧАСТИЦЫ
     ============================================================ */

  const particles = [];

  /** Случайная точка строго внутри сердца (rejection sampling) */
  function randomInteriorPoint() {
    for (let i = 0; i < 60; i++) {
      const x = nMinX + Math.random() * (nMaxX - nMinX);
      const y = nMinY + Math.random() * (nMaxY - nMinY);
      if (pointInPoly(x, y, outline)) return { x: x, y: y };
    }
    return { x: 0, y: 0 };
  }

  /** Создание одной частицы */
  function makeParticle() {
    let tx, ty;

    if (Math.random() < CONTOUR_RATIO) {
      // --- частица на контуре (с лёгким разбросом, чтобы контур был «живым») ---
      const f  = Math.random() * outline.length;
      const i0 = Math.floor(f) % outline.length;
      const i1 = (i0 + 1) % outline.length;
      const k  = f - Math.floor(f);

      tx = lerp(outline[i0].x, outline[i1].x, k) + (Math.random() - 0.5) * 0.014;
      ty = lerp(outline[i0].y, outline[i1].y, k) + (Math.random() - 0.5) * 0.014;
    } else {
      // --- частица внутри сердца, распределена равномерно ---
      const p = randomInteriorPoint();
      tx = p.x;
      ty = p.y;
    }

    // Масштаб частиц зависит от размера сердца (чтобы на телефоне не было «гигантов»)
    const sc = clamp(S / 620, 0.6, 1.3);

    return {
      // цель в нормализованном пространстве сердца
      tx: tx,
      ty: ty,

      // текущая позиция на экране (в CSS-пикселях)
      x: 0, y: 0,

      // стартовая позиция «хаотичного облака»
      sx: 0, sy: 0,

      // скорость (для фазы распада)
      vx: 0, vy: 0,

      r: (2.0 + Math.random() * 3.0) * sc,          // радиус отрисовки спрайта
      colorIdx: (Math.random() * WINE_PALETTE.length) | 0,
      hot: Math.random() < 0.35,                    // часть частиц — «раскалённые»

      alpha: 0,
      heat: 0,

      delay:        Math.random() * 0.45,           // индивидуальная задержка при сборке
      swirl:        Math.random() < 0.5 ? -1 : 1,   // направление закручивания
      swirlAmount:  0.5 + Math.random() * 1.2,

      driftPhase:   Math.random() * Math.PI * 2,    // фаза дрейфа
      driftSpeed:   0.6 + Math.random() * 1.8,

      flickerPhase: Math.random() * Math.PI * 2,    // фаза мерцания
      flickerSpeed: 4 + Math.random() * 12,

      seed: Math.random() * 1000
    };
  }

  /** Отправить частицу в случайную точку «хаотичного облака» вокруг сердца */
  function scatterToCloud(p) {
    const ang = Math.random() * Math.PI * 2;
    const rad = (0.35 + Math.random() * 1.05) * Math.max(W, H) * 0.6;

    p.sx = cx + Math.cos(ang) * rad;
    p.sy = cy + Math.sin(ang) * rad * 0.8;

    p.x = p.sx;
    p.y = p.sy;

    p.vx = 0;
    p.vy = 0;
    p.alpha = 0;
    p.heat = 0;
  }

  /** Полная пересборка массива частиц */
  function buildParticles() {
    // Количество зависит от размера экрана (от 550 до 1400)
    const count = Math.round(clamp(Math.min(W, H) * 1.6, 550, 1400));

    particles.length = 0;
    for (let i = 0; i < count; i++) {
      const p = makeParticle();
      scatterToCloud(p);
      particles.push(p);
    }
  }

  /* ============================================================
     6. ТАЙМЛАЙН ФАЗ
     ============================================================ */

  let phaseIndex = 0;
  let phaseTime  = 0;
  let time       = 0;   // общее время работы (для мерцаний/дрейфа)
  let puddle     = 0;   // текущая «сила» свечения-лужи под сердцем

  const arcs = [];      // активные молниевидные разряды
  let arcTimer = 0;

  function currentPhase()   { return PHASES[phaseIndex]; }
  function phaseProgress()  { return clamp(phaseTime / currentPhase().dur, 0, 1); }

  /** Действия при входе в новую фазу */
  function enterPhase(idx) {
    const name = PHASES[idx].name;

    if (name === 'gather') {
      // Раскидываем все частицы по хаотичному облаку
      for (let i = 0; i < particles.length; i++) scatterToCloud(particles[i]);

    } else if (name === 'disperse') {
      // Даём каждой частице импульс «взрыва» — наружу и вверх, как искры от костра
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        let dx = p.x - cx;
        let dy = p.y - cy;
        const len = Math.hypot(dx, dy) || 1;
        dx /= len;
        dy /= len;

        dy -= 0.7; // подбрасываем вверх (в canvas вверх = -Y)

        const l2 = Math.hypot(dx, dy) || 1;
        dx /= l2;
        dy /= l2;

        const sp = (0.55 + Math.random() * 1.15) * S * 1.1;

        p.vx = dx * sp + (Math.random() - 0.5) * 40;
        p.vy = dy * sp + (Math.random() - 0.5) * 40;
      }

    } else if (name === 'ignite') {
      arcTimer = 0.25;
    }
  }

  /* ============================================================
     7. МОЛНИЕВИДНЫЕ РАЗРЯДЫ ВНУТРИ СЕРДЦА
     ============================================================ */

  /** Ломаная от нижней части сердца к случайной точке контура */
  function makeArc() {
    const endIdx = (Math.random() * outline.length) | 0;
    const ex = outline[endIdx].x;
    const ey = outline[endIdx].y;

    // Старт — в нижней половине сердца, ближе к его середине
    const sx = (Math.random() - 0.5) * 0.28;
    const sy = nMinY + (nMaxY - nMinY) * (0.45 + Math.random() * 0.5);

    const steps = 7 + ((Math.random() * 5) | 0);
    const pts = [];

    for (let i = 0; i <= steps; i++) {
      const f = i / steps;
      const x = lerp(sx, ex, f);
      const y = lerp(sy, ey, f);
      // Дрожание сильнее в середине разряда
      const j = Math.sin(f * Math.PI) * 0.05;
      pts.push({
        x: x + (Math.random() - 0.5) * j,
        y: y + (Math.random() - 0.5) * j
      });
    }

    const lifeMax = 0.10 + Math.random() * 0.22;
    return { pts: pts, life: lifeMax, lifeMax: lifeMax };
  }

  /* ============================================================
     8. ОБНОВЛЕНИЕ ЛОГИКИ
     ============================================================ */

  function update(dt) {
    time += dt;

    // ---------- Таймлайн фаз ----------
    phaseTime += dt;
    let guard = 0;
    while (phaseTime >= PHASES[phaseIndex].dur && guard++ < 10) {
      phaseTime -= PHASES[phaseIndex].dur;
      phaseIndex = (phaseIndex + 1) % PHASES.length;
      enterPhase(phaseIndex);
    }

    const phase = currentPhase().name;
    const prog  = phaseProgress();

    // ---------- «Лужа» тлеющего огня под сердцем ----------
    let pTarget = 0;
    if (phase === 'gather') {
      pTarget = 0.08 + 0.34 * smoothstep(0.55, 1, prog);
    } else if (phase === 'ignite') {
      pTarget = 0.42 + 0.58 * prog;
    } else if (phase === 'burn') {
      pTarget = 1.0;
    } else {
      pTarget = (1 - prog) * (1 - prog);
    }
    puddle += (pTarget - puddle) * Math.min(1, dt * 5);

    // ---------- Разряды ----------
    if (phase === 'ignite') {
      arcTimer -= dt;
      if (arcTimer <= 0 && prog > 0.35) {
        arcs.push(makeArc());
        arcTimer = 0.10 + Math.random() * 0.35;
      }
    } else if (phase === 'burn') {
      arcTimer -= dt;
      if (arcTimer <= 0) {
        arcs.push(makeArc());
        arcTimer = 0.04 + Math.random() * 0.20;
      }
    }

    for (let i = arcs.length - 1; i >= 0; i--) {
      arcs[i].life -= dt;
      if (arcs[i].life <= 0) arcs.splice(i, 1);
    }

    // ---------- Частицы ----------
    updateParticles(dt, phase, prog);
  }

  function updateParticles(dt, phase, prog) {
    // Общая «пульсация» сердца в горячих фазах
    const pulsing = (phase === 'ignite' || phase === 'burn');
    const pulse = pulsing
      ? 1 + 0.030 * Math.sin(time * 3.1) + 0.015 * Math.sin(time * 7.7 + 1.3)
      : 1;
    const scale = S * pulse;

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      const TX = cx + p.tx * scale;
      const TY = cy + p.ty * scale;

      if (phase === 'gather') {
        /* --- СБОРКА: частица летит из облака к своей точке --- */
        const d = p.delay * 0.7;
        const local = clamp((prog - d) / (1 - d), 0, 1);
        const e = 1 - Math.pow(1 - local, 3);   // easeOutCubic
        const k = 1 - e;

        const dx = p.sx - TX;
        const dy = p.sy - TY;

        // Затухающее закручивание вокруг цели — полёт идёт по дуге
        const ang = p.swirl * p.swirlAmount * e;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        const rx = dx * ca - dy * sa;
        const ry = dx * sa + dy * ca;

        p.x = TX + rx * k + Math.sin(time * 2.2 + p.seed) * 4 * k;
        p.y = TY + ry * k + Math.cos(time * 1.9 + p.seed) * 4 * k;

        p.alpha = smoothstep(0.0, 0.25, local);
        p.heat  = 0;

      } else if (phase === 'ignite') {
        /* --- РОЗЖИГ: плазма поднимается снизу вверх --- */
        const vn = (nMaxY - p.ty) / (nMaxY - nMinY); // 0 — низ, 1 — верх
        const front = prog * 1.3;

        p.heat = clamp((front - vn) / 0.30, 0, 1);

        const j = 0.6 + p.heat * 2.8;
        p.x = TX + Math.sin(time * p.driftSpeed + p.driftPhase) * j;
        p.y = TY + Math.cos(time * p.driftSpeed * 0.83 + p.driftPhase * 1.6) * j;

        p.alpha = 0.30 + 0.70 * p.heat;

      } else if (phase === 'burn') {
        /* --- ГОРЕНИЕ: пульс, максимальный жар, сильное мерцание --- */
        p.heat = 1;

        const j = 1.2 + 2.4 * Math.abs(Math.sin(time * 3.3 + p.seed * 0.1));
        p.x = TX + Math.sin(time * p.driftSpeed * 1.5 + p.driftPhase) * j;
        p.y = TY + Math.cos(time * p.driftSpeed * 1.25 + p.driftPhase * 1.6) * j;

        p.alpha = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(time * p.flickerSpeed * 0.6 + p.flickerPhase));

      } else {
        /* --- РАСПАД: частицы разлетаются и гаснут, как пепел --- */
        const drag = Math.exp(-1.9 * dt);
        p.vx *= drag;
        p.vy *= drag;
        p.vy -= 30 * dt;   // медленное всплывание вверх

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.alpha = Math.pow(1 - prog, 1.7);
        p.heat *= Math.exp(-4 * dt);
      }
    }
  }

  /* ============================================================
     9. ОТРИСОВКА
     ============================================================ */

  /** Свечение-«лужа» тлеющего огня под сердцем */
  function drawPuddle() {
    if (puddle < 0.01) return;

    // Живое мерцание «углей»
    const flick = 0.82 + 0.18 * Math.sin(time * 9.3) * Math.sin(time * 5.1 + 1.3);
    const strength = puddle * flick;

    const baseY = cy + nMaxY * S;       // кончик сердца
    const py = baseY + S * 0.02;

    const rx = S * (0.34 + 0.03 * Math.sin(time * 1.7));
    const ry = S * (0.085 + 0.015 * Math.sin(time * 2.9));

    // --- Основное эллиптическое свечение ---
    ctx.save();
    ctx.translate(cx, py);
    ctx.scale(1, ry / rx);

    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0.00, 'rgba(255, 120,  90, ' + (0.16 * strength) + ')');
    g.addColorStop(0.22, 'rgba(190,  40,  60, ' + (0.14 * strength) + ')');
    g.addColorStop(0.55, 'rgba(110,  12,  28, ' + (0.09 * strength) + ')');
    g.addColorStop(1.00, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // --- Маленькое яркое ядро (раскалённые угли) ---
    ctx.save();
    ctx.translate(cx, py);
    ctx.scale(1, 0.35);

    const r2 = rx * 0.35;
    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, r2);
    g2.addColorStop(0.0, 'rgba(255, 180, 140, ' + (0.20 * strength) + ')');
    g2.addColorStop(0.5, 'rgba(200,  50,  60, ' + (0.10 * strength) + ')');
    g2.addColorStop(1.0, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(0, 0, r2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /** Внутреннее свечение сердца (эффект «горит изнутри») */
  function drawCore() {
    if (puddle < 0.05) return;

    const flick = 0.85 + 0.15 * Math.sin(time * 8.7) * Math.sin(time * 4.3 + 0.7);
    const R = S * 0.42;
    const ox = cx;
    const oy = cy + S * 0.06;

    const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, R);
    g.addColorStop(0.0, 'rgba(200, 45, 60, ' + (0.10 * puddle * flick) + ')');
    g.addColorStop(0.5, 'rgba(120, 15, 30, ' + (0.06 * puddle * flick) + ')');
    g.addColorStop(1.0, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ox, oy, R, 0, Math.PI * 2);
    ctx.fill();
  }

  /** Отрисовка всех частиц */
  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.alpha <= 0.01) continue;

      // Выбор спрайта: «раскалённый» или обычный
      const useHot = (p.heat > 0.45 && p.hot);
      const spr = useHot ? hotSprites[p.colorIdx] : sprites[p.colorIdx];

      // Индивидуальное мерцание
      const flick = 0.72 + 0.28 * Math.sin(time * p.flickerSpeed + p.flickerPhase);
      const a = p.alpha * flick;
      if (a <= 0.01) continue;

      // В горячих фазах частица чуть раздувается
      const r = p.r * (1 + p.heat * 0.9);

      ctx.globalAlpha = a > 1 ? 1 : a;
      ctx.drawImage(spr, p.x - r, p.y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }

  /** Отрисовка молниевидных разрядов */
  function drawArcs() {
    ctx.lineJoin = 'round';
    ctx.lineCap  = 'round';

    for (let i = arcs.length - 1; i >= 0; i--) {
      const a = arcs[i];
      const k = a.life / a.lifeMax;   // 1 -> 0
      if (k <= 0) continue;

      ctx.beginPath();
      ctx.moveTo(cx + a.pts[0].x * S, cy + a.pts[0].y * S);
      for (let j = 1; j < a.pts.length; j++) {
        ctx.lineTo(cx + a.pts[j].x * S, cy + a.pts[j].y * S);
      }

      // Внешнее свечение
      ctx.strokeStyle = 'rgba(150, 20, 45, ' + (0.30 * k) + ')';
      ctx.lineWidth = 4.5;
      ctx.stroke();

      // Средний слой
      ctx.strokeStyle = 'rgba(220, 70, 80, ' + (0.55 * k) + ')';
      ctx.lineWidth = 2.0;
      ctx.stroke();

      // Яркое ядро разряда
      ctx.strokeStyle = 'rgba(255, 220, 210, ' + (0.85 * k) + ')';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }

  /** Полный кадр */
  function render() {
    // 1) Затемняем предыдущий кадр — получаем «шлейфы» у летящих искр
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.40)';
    ctx.fillRect(0, 0, W, H);

    // 2) Всё свечение — аддитивно
    ctx.globalCompositeOperation = 'lighter';

    drawCore();
    drawPuddle();
    drawParticles();
    drawArcs();

    // 3) Возвращаем режим по умолчанию
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ============================================================
     10. ГЛАВНЫЙ ЦИКЛ
     ============================================================ */

  let lastT = 0;

  function frame(now) {
    if (!lastT) lastT = now;

    let dt = (now - lastT) / 1000;
    lastT = now;

    // Защита от огромных скачков (сворачивание вкладки, лаги)
    if (dt > 0.05) dt = 0.05;
    if (dt < 0)    dt = 0;

    update(dt);
    render();

    requestAnimationFrame(frame);
  }

  /* ============================================================
     11. СТАРТ И РЕАКЦИЯ НА ИЗМЕНЕНИЕ РАЗМЕРА
     ============================================================ */

  resize();
  buildParticles();
  enterPhase(0);

  window.addEventListener('resize', function () {
    resize();
  }, { passive: true });

  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 120);
  }, { passive: true });

  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
